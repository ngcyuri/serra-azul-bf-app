name: Gerar APK Serra Azul BF

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Descompactar projeto Android
        run: |
          mkdir -p projeto
          unzip -o *.zip -d projeto

      - name: Localizar projeto Android
        run: |
          echo "Projetos encontrados:"
          find projeto -maxdepth 3 -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \)

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Remover arquivos temporários
        run: |
          echo "Removendo arquivos temporários dos recursos Android..."
          find projeto -type f -name "*.tmp" -delete

      - name: Verificar arquivos de recursos
        run: |
          echo "Arquivos temporários restantes:"
          find projeto -type f -name "*.tmp" || true

      - name: Encontrar projeto Gradle
        run: |
          GRADLE_PROJECT=$(find projeto -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit)

          if [ -z "$GRADLE_PROJECT" ]; then
            echo "ERRO: projeto Gradle não encontrado."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLE_PROJECT")

          echo "Projeto encontrado em:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Compilar APK
        run: |
          cd "$PROJECT_DIR"

          echo "Iniciando compilação..."
          gradle assembleDebug --stacktrace

      - name: Localizar APK
        run: |
          echo "Procurando APK gerado..."
          find . -type f -name "*.apk" -print

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Serra-Azul-BF-APK
          path: projeto/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
