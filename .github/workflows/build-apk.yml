name: Gerar APK Serra Azul BF

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Descompactar projeto Android
        run: |
          mkdir -p projeto
          unzip -o *.zip -d projeto

      - name: Remover arquivos temporários
        run: |
          echo "Limpando arquivos temporários..."
          find projeto -type f -name "*.tmp" -delete

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Encontrar projeto Android
        run: |
          echo "Procurando projeto..."
          find projeto -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \)

      - name: Definir pasta do projeto
        run: |
          SETTINGS=$(find projeto -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle não encontrado."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Projeto encontrado em:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verificar Gradle
        run: |
          gradle --version

      - name: Compilar APK
        run: |
          cd "$PROJECT_DIR"
          echo "Compilando Serra Azul BF..."
          gradle assembleDebug --stacktrace --no-daemon

      - name: Localizar APK
        run: |
          echo "Procurando APK..."
          find projeto -type f -name "*.apk" -print

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Serra-Azul-BF-APK
          path: projeto/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
