name: Gerar APK Serra Azul BF

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Descompactar projeto Android
        run: |
          mkdir -p projeto
          unzip -o *.zip -d projeto

      - name: Localizar projeto Android
        run: |
          GRADLEW=$(find projeto -type f -name gradlew | head -n 1)
          echo "Gradle encontrado em: $GRADLEW"
          test -n "$GRADLEW"

      - name: Dar permissão ao Gradle
        run: |
          GRADLEW=$(find projeto -type f -name gradlew | head -n 1)
          chmod +x "$GRADLEW"

      - name: Compilar APK
        run: |
          GRADLEW=$(find projeto -type f -name gradlew | head -n 1)
          PROJECT_DIR=$(dirname "$GRADLEW")
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Serra-Azul-BF-APK
          path: projeto/**/app/build/outputs/apk/debug/app-debug.apk
